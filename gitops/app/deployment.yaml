apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-web-app
  namespace: hr-analytics
  labels:
    app: hr-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-web
  template:
    metadata:
      labels:
        app: hr-web
    spec:
      containers:
      - name: web
        image: pavloyar/hr-web-app:v1
        ports:
        - containerPort: 5000
