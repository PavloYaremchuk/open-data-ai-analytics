apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: hr-analytics
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web
        image: python:3.9-slim
        command: ["sleep", "infinity"]
        ports:
        - containerPort: 5000
